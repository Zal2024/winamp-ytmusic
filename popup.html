<!DOCTYPE html>
<html data-wa-skin="classic">
  <head>
    <meta charset="utf-8" />
    <style>
      :root,
      :root[data-wa-skin="classic"] {
        --wa-chassis: #222436;
        --wa-chassis-dark: #141520;
        --wa-chassis-bevel-lt: #4c4f6f;
        --wa-chassis-grad: radial-gradient(
          ellipse 130% 85% at 50% -15%,
          #353954 0%,
          #222436 45%,
          #151624 80%,
          #0b0c13 100%
        );
        --wa-panel-bg: #11121d;
        --wa-btn-face: #b4b8c4;
        --wa-btn-face-pressed: #a0a4b0;
        --wa-btn-highlight: #ffffff;
        --wa-btn-shadow: #5a5a66;
        --wa-btn-outline: #101018;
        --wa-btn-glyph: #1c1c28;
        --wa-screen-bg: #000000;
        --wa-screen-bevel-lt: #3e4056;
        --wa-led-green: #00e000;
        --wa-led-secondary: #00a000;
        --wa-titlebar-btn: #6b6648;
      }

      :root[data-wa-skin="modern"] {
        --wa-chassis: #191a22;
        --wa-chassis-dark: #0e0f14;
        --wa-chassis-bevel-lt: #383a48;
        --wa-chassis-grad: radial-gradient(
          ellipse 130% 85% at 50% -15%,
          #2a2c38 0%,
          #191a22 45%,
          #101117 80%,
          #07070a 100%
        );
        --wa-panel-bg: #111218;
        --wa-btn-face: #8e92a0;
        --wa-btn-face-pressed: #7c808e;
        --wa-btn-highlight: #c0c4d4;
        --wa-btn-shadow: #484a56;
        --wa-btn-outline: #0f1016;
        --wa-btn-glyph: #0f1016;
        --wa-screen-bg: #08090d;
        --wa-screen-bevel-lt: #323544;
        --wa-led-green: #00e5ff;
        --wa-led-secondary: #00b0c8;
        --wa-titlebar-btn: #525668;
      }

      :root[data-wa-skin="gold"] {
        --wa-chassis: #2b261e;
        --wa-chassis-dark: #16130f;
        --wa-chassis-bevel-lt: #544b3c;
        --wa-chassis-grad: radial-gradient(
          ellipse 130% 85% at 50% -15%,
          #463d30 0%,
          #2b261e 45%,
          #1b1712 80%,
          #0d0b08 100%
        );
        --wa-panel-bg: #1a1610;
        --wa-btn-face: #c8bc9e;
        --wa-btn-face-pressed: #b4a88a;
        --wa-btn-highlight: #f0e8d0;
        --wa-btn-shadow: #6a624e;
        --wa-btn-outline: #181510;
        --wa-btn-glyph: #221c14;
        --wa-screen-bg: #100d08;
        --wa-screen-bevel-lt: #4a4030;
        --wa-led-green: #ffb81c;
        --wa-led-secondary: #dfac30;
        --wa-titlebar-btn: #7a6848;
      }

      :root[data-wa-skin="cyberpunk"] {
        --wa-chassis: #121118;
        --wa-chassis-dark: #08070c;
        --wa-chassis-bevel-lt: #3e284e;
        --wa-chassis-grad: radial-gradient(
          ellipse 130% 85% at 50% -15%,
          #2a1638 0%,
          #171120 45%,
          #0e0914 80%,
          #060309 100%
        );
        --wa-panel-bg: #0f0b18;
        --wa-btn-face: #5c4c68;
        --wa-btn-face-pressed: #4a3c54;
        --wa-btn-highlight: #8a749c;
        --wa-btn-shadow: #282030;
        --wa-btn-outline: #0a080e;
        --wa-btn-glyph: #0a080e;
        --wa-screen-bg: #08040c;
        --wa-screen-bevel-lt: #38224a;
        --wa-led-green: #39ff14;
        --wa-led-secondary: #ff007f;
        --wa-titlebar-btn: #683264;
      }

      * {
        box-sizing: border-box;
        border-radius: 0 !important;
        -webkit-font-smoothing: none;
        user-select: none;
      }

      body {
        margin: 0;
        width: 264px;
        font-family: "Lucida Console", "Courier New", "Consolas", monospace;
        font-size: 10px;
        text-transform: uppercase;
        color: #ffffff;
        background-color: var(--wa-chassis);
        background-image: var(--wa-chassis-grad);
        border: 1px solid #090a10;
        box-shadow:
          inset 1px 1px 0 var(--wa-chassis-bevel-lt),
          inset -1px -1px 0 #0b0c14;
        padding: 3px;
      }

      /* Authentic Winamp 2.x Window Title Bar */
      .wa-window-titlebar {
        display: flex;
        align-items: center;
        height: 20px;
        padding: 0 5px;
        background: var(--wa-chassis);
        border: 1px solid #0d0e16;
        box-shadow:
          inset 1px 1px 0 var(--wa-chassis-bevel-lt),
          inset -1px -1px 0 #0d0e16;
      }

      .wa-lightning-bolt {
        display: inline-block;
        width: 11px;
        height: 9px;
        margin-right: 4px;
        flex-shrink: 0;
        background: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2011%209'%20shape-rendering='crispEdges'%3E%3Crect%20x='3'%20y='1'%20width='1'%20height='1'%20fill='%23a08134'/%3E%3Crect%20x='2'%20y='2'%20width='1'%20height='1'%20fill='%23b69c54'/%3E%3Crect%20x='3'%20y='2'%20width='1'%20height='1'%20fill='%232c231f'/%3E%3Crect%20x='4'%20y='2'%20width='1'%20height='1'%20fill='%23a08134'/%3E%3Crect%20x='1'%20y='3'%20width='1'%20height='1'%20fill='%23b69c54'/%3E%3Crect%20x='2'%20y='3'%20width='1'%20height='1'%20fill='%232c231f'/%3E%3Crect%20x='3'%20y='3'%20width='1'%20height='1'%20fill='%231f1f22'/%3E%3Crect%20x='4'%20y='3'%20width='1'%20height='1'%20fill='%23a08134'/%3E%3Crect%20x='1'%20y='4'%20width='1'%20height='1'%20fill='%23b69c54'/%3E%3Crect%20x='2'%20y='4'%20width='2'%20height='1'%20fill='%235d5029'/%3E%3Crect%20x='4'%20y='4'%20width='2'%20height='1'%20fill='%23a08134'/%3E%3Crect%20x='6'%20y='4'%20width='3'%20height='1'%20fill='%23685935'/%3E%3Crect%20x='9'%20y='4'%20width='1'%20height='1'%20fill='%23a08134'/%3E%3Crect%20x='5'%20y='5'%20width='1'%20height='1'%20fill='%23a08134'/%3E%3Crect%20x='6'%20y='5'%20width='1'%20height='1'%20fill='%231f1f22'/%3E%3Crect%20x='7'%20y='5'%20width='1'%20height='1'%20fill='%232c231f'/%3E%3Crect%20x='8'%20y='5'%20width='1'%20height='1'%20fill='%23a08134'/%3E%3Crect%20x='5'%20y='6'%20width='1'%20height='1'%20fill='%23a08134'/%3E%3Crect%20x='6'%20y='6'%20width='1'%20height='1'%20fill='%231f1f22'/%3E%3Crect%20x='7'%20y='6'%20width='2'%20height='1'%20fill='%23a08134'/%3E%3Crect%20x='6'%20y='7'%20width='1'%20height='1'%20fill='%23a08134'/%3E%3C/svg%3E") no-repeat center / 11px 9px;
        image-rendering: pixelated;
      }

      .wa-tb-grip {
        flex: 1 1 auto;
        height: 7px;
        margin: 0 5px;
        background: linear-gradient(
          to bottom,
          #141520 0px,
          #141520 1px,
          #9e8c5a 1px,
          #9e8c5a 2px,
          #b4b4b8 2px,
          #b4b4b8 3px,
          #383424 3px,
          #383424 4px,
          #786c48 4px,
          #786c48 5px,
          #141520 5px,
          #141520 7px
        );
        border-top: 1px solid #141520;
        border-bottom: 1px solid #383424;
      }

      .wa-tb-title-text {
        color: #ffffff;
        font-weight: bold;
        font-size: 10px;
        letter-spacing: 1px;
        white-space: nowrap;
        text-shadow: 1px 1px 0 #000000;
      }

      .wa-tb-btns {
        display: flex;
        align-items: center;
        gap: 2px;
        margin-left: 2px;
      }

      .wa-tb-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 9px;
        height: 9px;
        background: var(--wa-titlebar-btn);
        border: 1px solid #101018;
        box-shadow:
          inset 1px 1px 0 #9e9874,
          inset -1px -1px 0 #3a3728;
        color: #141520;
        font-size: 7px;
        line-height: 1;
        font-weight: bold;
      }

      /* Recessed Inner Panel */
      .panel {
        margin-top: 3px;
        background: var(--wa-panel-bg);
        border: 1px solid #090a10;
        box-shadow:
          inset 1px 1px 0 #07080d,
          inset -1px -1px 0 var(--wa-screen-bevel-lt);
        padding: 8px 10px 10px;
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 0;
      }

      .row + .row {
        border-top: 1px solid #1c1e2e;
        box-shadow: inset 0 1px 0 #090a10;
      }

      .row-col {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 7px 0 6px;
        border-top: 1px solid #1c1e2e;
        box-shadow: inset 0 1px 0 #090a10;
      }

      .row-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
      }

      .lbl {
        color: #e4e8f4;
        font-size: 10px;
        font-weight: bold;
        letter-spacing: 0.5px;
        text-shadow: 1px 1px 0 #000000;
        cursor: pointer;
      }

      /* Sunken LCD Readout Badge */
      .lcd-badge {
        background: var(--wa-screen-bg);
        color: var(--wa-led-green);
        font-size: 10px;
        font-weight: bold;
        letter-spacing: 0.5px;
        padding: 2px 5px;
        min-width: 44px;
        text-align: center;
        border: 1px solid #08080c;
        box-shadow:
          inset 1px 1px 0 #000000,
          inset -1px -1px 0 var(--wa-screen-bevel-lt);
        text-shadow: 0 0 4px rgba(0, 224, 0, 0.35);
      }

      /* Hardware Toggle Switch (matches Autoplay switch in winamp.css) */
      .sw {
        position: relative;
        width: 36px;
        height: 16px;
        flex: none;
        display: inline-block;
      }

      .sw input {
        position: absolute;
        inset: 0;
        opacity: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        cursor: pointer;
        z-index: 2;
      }

      .sw .track {
        position: absolute;
        inset: 0;
        background: #090a0f;
        border: 1px solid var(--wa-btn-outline);
        box-shadow:
          inset 1px 1px 2px #000000,
          inset -1px -1px 0 var(--wa-screen-bevel-lt);
        transition: background 0.12s ease;
      }

      .sw input:checked ~ .track {
        background: #061608;
        border-color: #0b220e;
        box-shadow:
          inset 1px 1px 2px #000000,
          inset 0 0 4px rgba(0, 255, 0, 0.25);
      }

      .sw .knob {
        position: absolute;
        top: 0;
        left: 0;
        width: 18px;
        height: 16px;
        background: var(--wa-btn-face);
        border: 1px solid var(--wa-btn-outline);
        box-shadow:
          inset 1px 1px 0 var(--wa-btn-highlight),
          inset -1px -1px 0 var(--wa-btn-shadow),
          0 1px 2px rgba(0, 0, 0, 0.5);
        transition: transform 0.12s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .sw input:checked ~ .knob {
        transform: translate(18px, 0);
      }

      /* Center 4x4 LED square inside switch thumb */
      .sw .knob::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 4px;
        height: 4px;
        background: #1c2618;
        border: 1px solid #0d140a;
      }

      .sw input:checked ~ .knob::after {
        background: var(--wa-led-green);
        border: none;
        box-shadow:
          0 0 3px var(--wa-led-green),
          0 0 6px var(--wa-led-green);
      }

      /* Winamp LCD Select Dropdown with Bevel Arrow */
      .select-wrap {
        position: relative;
        display: inline-flex;
        align-items: center;
      }

      .wa-select {
        appearance: none;
        -webkit-appearance: none;
        background: var(--wa-screen-bg);
        color: var(--wa-led-green);
        font-family: "Lucida Console", "Courier New", "Consolas", monospace;
        font-size: 10px;
        font-weight: bold;
        text-transform: uppercase;
        border: 1px solid #08080c;
        box-shadow:
          inset 1px 1px 0 #000000,
          inset -1px -1px 0 var(--wa-screen-bevel-lt);
        padding: 3px 22px 3px 6px;
        cursor: pointer;
        outline: none;
        width: 138px;
      }

      .wa-select option {
        background: #0b0c13;
        color: var(--wa-led-green);
      }

      .select-arrow {
        position: absolute;
        right: 1px;
        top: 1px;
        bottom: 1px;
        width: 16px;
        background: var(--wa-btn-face);
        border-left: 1px solid var(--wa-btn-outline);
        box-shadow:
          inset 1px 1px 0 var(--wa-btn-highlight),
          inset -1px -1px 0 var(--wa-btn-shadow);
        pointer-events: none;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .select-arrow::after {
        content: "";
        width: 6px;
        height: 4px;
        background: var(--wa-btn-glyph);
        clip-path: polygon(0 0, 100% 0, 50% 100%);
      }

      /* Winamp Hardware Range Slider (matches Volume Slider in player bar) */
      .slider-wrap {
        position: relative;
        width: 100%;
        height: 14px;
        display: flex;
        align-items: center;
      }

      .wa-slider {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 8px;
        margin: 0;
        background: #000000;
        border: 1px solid #0a0a0f;
        box-shadow:
          inset 1px 1px 0 #000000,
          inset -1px -1px 0 var(--wa-screen-bevel-lt);
        background-image: linear-gradient(
          to right,
          #00e000 0%,
          #c8c800 50%,
          #e07000 80%,
          #e00000 100%
        );
        background-repeat: no-repeat;
        background-size: var(--slider-pct, 65%) 100%;
        cursor: pointer;
        outline: none;
      }

      .wa-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 14px;
        height: 12px;
        background-color: var(--wa-btn-face);
        background-image: repeating-linear-gradient(
          to right,
          transparent 0px,
          transparent 3px,
          var(--wa-btn-shadow) 3px,
          var(--wa-btn-shadow) 4px,
          var(--wa-btn-highlight) 4px,
          var(--wa-btn-highlight) 5px
        );
        border: 1px solid var(--wa-btn-outline);
        box-shadow:
          inset 1px 1px 0 var(--wa-btn-highlight),
          inset -1px -1px 0 var(--wa-btn-shadow),
          0 1px 2px rgba(0, 0, 0, 0.6);
        cursor: pointer;
      }

      .wa-slider::-webkit-slider-thumb:active {
        background-color: var(--wa-btn-face-pressed);
        box-shadow:
          inset 1px 1px 0 var(--wa-btn-shadow),
          inset -1px -1px 0 var(--wa-btn-highlight);
      }

      .slider-presets {
        display: flex;
        justify-content: space-between;
        width: 100%;
        margin-top: 1px;
      }

      .preset-btn {
        background: #bdced6;
        color: #101018;
        border: 1px solid #202034;
        box-shadow:
          inset 1px 1px 0 #efffff,
          inset -1px -1px 0 #4a5a6b,
          inset 2px 2px 0 #adb5c6,
          inset -2px -2px 0 #7b8494;
        font-family: "Lucida Console", "Courier New", "Consolas", monospace;
        font-size: 9px;
        font-weight: bold;
        padding: 2px 6px;
        cursor: pointer;
        text-transform: uppercase;
      }

      .preset-btn:active,
      .preset-btn.is-active {
        background: #97a8b9;
        box-shadow:
          inset 1px 1px 0 #202034,
          inset -1px -1px 0 #efffff,
          inset 2px 2px 0 #4a5a6b,
          inset -2px -2px 0 #adb5c6;
        color: #000000;
      }

      /* Recessed LCD Status Info Box at Bottom */
      .status-well {
        margin-top: 8px;
        padding: 6px 7px;
        background: var(--wa-screen-bg);
        border: 1px solid #08080c;
        box-shadow:
          inset 1px 1px 0 #000000,
          inset -1px -1px 0 var(--wa-screen-bevel-lt);
        color: var(--wa-led-secondary);
        font-size: 9px;
        line-height: 1.45;
        letter-spacing: 0.3px;
      }

      .status-well b {
        color: var(--wa-led-green);
        font-weight: bold;
      }

      .keycap {
        display: inline-block;
        padding: 0 4px;
        background: var(--wa-btn-face);
        color: var(--wa-btn-glyph);
        border: 1px solid var(--wa-btn-outline);
        box-shadow:
          inset 1px 1px 0 var(--wa-btn-highlight),
          inset -1px -1px 0 var(--wa-btn-shadow);
        font-weight: bold;
        font-size: 9px;
      }

      .wa-popup-footer {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        margin-top: 8px;
        padding-top: 6px;
        border-top: 1px solid #1c1e2e;
        box-shadow: inset 0 1px 0 #090a10;
      }

      .wa-footer-diamond {
        width: 14px;
        height: 14px;
        image-rendering: pixelated;
      }

      .wa-footer-tagline {
        font-size: 8px;
        color: #7a8296;
        letter-spacing: 0.8px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="wa-window-titlebar">
      <span class="wa-lightning-bolt"></span>
      <div class="wa-tb-grip"></div>
      <span class="wa-tb-title-text">WINAMP YTM</span>
      <div class="wa-tb-grip"></div>
      <div class="wa-tb-btns">
        <span class="wa-tb-btn">_</span>
        <span class="wa-tb-btn">□</span>
      </div>
    </div>

    <div class="panel">
      <div class="row">
        <label for="theme" class="lbl">ENABLE SKIN</label>
        <span class="sw">
          <input type="checkbox" id="theme" checked />
          <span class="track"></span>
          <span class="knob"></span>
        </span>
      </div>

      <div class="row">
        <label for="skin" class="lbl">CHASSIS SKIN</label>
        <div class="select-wrap">
          <select id="skin" class="wa-select">
            <option value="classic">CLASSIC 2.X</option>
            <option value="modern">MODERN ONYX</option>
            <option value="gold">CHAMPAGNE GOLD</option>
            <option value="cyberpunk">ACID NEON</option>
          </select>
          <span class="select-arrow"></span>
        </div>
      </div>

      <div class="row">
        <label for="audio" class="lbl">AUDIO ONLY</label>
        <span class="sw">
          <input type="checkbox" id="audio" checked />
          <span class="track"></span>
          <span class="knob"></span>
        </span>
      </div>

      <div class="row-col">
        <div class="row-header">
          <label for="smooth" class="lbl">VIZ SMOOTHING</label>
          <span id="smooth-val" class="lcd-badge">65%</span>
        </div>
        <div class="slider-wrap">
          <input
            type="range"
            id="smooth"
            class="wa-slider"
            min="0"
            max="100"
            step="1"
            value="65"
          />
        </div>
        <div class="slider-presets">
          <button type="button" class="preset-btn" data-smooth="20">
            FAST
          </button>
          <button type="button" class="preset-btn is-active" data-smooth="65">
            AUTO (65%)
          </button>
          <button type="button" class="preset-btn" data-smooth="90">
            SILKY
          </button>
        </div>
      </div>

      <div class="status-well">
        TOGGLE SHORTCUT: <span class="keycap">ALT+W</span><br />
        <b>AUDIO ONLY</b> HIDES VIDEO &amp; FORCES SONG MODE.
      </div>

      <div class="wa-popup-footer">
        <img src="icons/winamp-diamond.png" class="wa-footer-diamond" alt="Winamp" />
        <span class="wa-footer-tagline">WINAMP 2.X FOR YT MUSIC</span>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
